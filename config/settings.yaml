# AROS runtime configuration
# Every runtime parameter is centralized here so the code stays config-driven
# (project principle: 所有参数配置化). Environment variables may override
# individual keys — see .env.example.

app_name: AROS

data:
  source: akshare          # data provider (AKShare)
  frequency: daily         # bar frequency
  start_date: "2015-01-01" # inclusive data start
  end_date: "2026-06-30"   # inclusive data end
  # symbols: null          # null = all available A-share codes

database:
  url: sqlite:///data/aros.db

paths:
  data_dir: data
  cache_dir: data/cache
  report_dir: reports

logging:
  level: INFO
  dir: logs

# Indicator Engine (Sprint 1.3) - every parameter stays config-driven.
# Same indicator name may appear multiple times with different params
# (e.g. ma with window 5 and 20) to build multi-period features.
indicators:
  enabled:
    - name: ma
      params: { window: 5 }
    - name: ma
      params: { window: 20 }
    - name: ema
      params: { window: 12 }
    - name: rsi
      params: { window: 14 }
    - name: macd
      params: {}
    - name: kdj
      params: {}
    - name: boll
      params: { window: 20, num_std: 2.0 }
    - name: vol_ma
      params: { window: 5 }

# Factor Engine (Sprint 1.4) - factors sit on top of indicator columns.
# Each factor's params reference the indicator windows produced above, so the
# two sections must stay consistent (e.g. ma_distance.window must match an
# enabled ma with the same window).
factors:
  enabled:
    - name: ma_distance
      params: { window: 20 }
    - name: ma_cross
      params: { fast: 5, slow: 20 }
    - name: rsi_signal
      params: { window: 14, lower: 30, upper: 70 }
    - name: macd_cross
      params: {}
    - name: kdj_cross
      params: {}
    - name: vol_ratio
      params: { window: 5 }
    - name: boll_position
      params: { window: 20 }
    - name: momentum
      params: { window: 5 }

# Strategy Engine (Sprint 1.5) - 组合因子为可交易信号
# 注意：每个 weight / condition 的 factor 引用的是「因子层输出的列名」
# （如 ma_dist_20），其命名由 factors 段的窗口决定，两处必须保持一致。
strategies:
  enabled:
    - name: weighted_momentum
      type: weighted
      params:
        weights:
          - { factor: ma_dist_20,    weight: 0.15, clip: [-0.15, 0.15] }
          - { factor: ma_cross_5_20, weight: 0.20 }
          - { factor: rsi_signal_14, weight: 0.15 }
          - { factor: macd_cross,    weight: 0.20 }
          - { factor: kdj_cross,     weight: 0.15 }
          - { factor: vol_ratio_5,   weight: 0.05, clip: [0.5, 2.5] }
          - { factor: boll_pos_20,   weight: 0.05 }
          - { factor: mom_5,         weight: 0.05, clip: [-0.1, 0.1] }
        buy_threshold: 0.30
        sell_threshold: -0.30
    - name: golden_cross_rule
      type: rule
      params:
        combine: all
        conditions:
          - { factor: ma_cross_5_20, op: ">",  value: 0 }
          - { factor: macd_cross,    op: ">",  value: 0 }
          - { factor: rsi_signal_14, op: "<",  value: 70 }

# Backtest Engine (Sprint 1.6) - 把信号模拟成真实 A 股组合
# 复用 indicators/factors/strategies 配置；费率全部可配，改这里即可无需改码。
backtest:
  strategy: weighted_momentum        # 回测哪个策略的 signal_<name>；缺省取第一个
  initial_cash: 1000000.0
  max_position: 1.0                  # 单标的仓位上限（1.0 = 满仓）
  risk_free: 0.0                     # 无风险年化，用于 Sharpe/Sortino
  metrics:
    - total_return
    - cagr
    - max_drawdown
    - sharpe
    - sortino
    - win_rate
    - num_trades
    - turnover
  benchmark: true                    # 与同名标的买入持有对比
  cache_enabled: true                 # 回测结果落库缓存，相同窗口/参数跳过仿真（Sprint 1.12）
  cost:
    commission_rate: 0.00025          # 万 2.5
    commission_min: 5.0              # 单笔最低佣金（按侧计）
    stamp_tax_rate: 0.0005           # 万 5，仅卖出
    transfer_fee_rate: 0.00001       # 万 0.1，双边
    slippage: 0.0                    # 滑点，双边，简化为成本拖累

# Ranking Engine (Sprint 1.7) - 跨标的截面复合打分排序，选 Top N
# 复用 indicators/factors/strategies；排序依据是各策略的 score_<name> 连续分。
ranking:
  top_n: 20                          # 取前 N 名
  as_of: null                        # null => 每个标的取最新一根 K 线
  dimensions: null                   # null => 所有启用策略等权参与
  # 显式配置示例（取消注释启用）：
  # dimensions:
  #   - strategy: weighted_momentum
  #     weight: 1.0
  #   - strategy: golden_cross_rule
  #     weight: 0.5

# Daily Report Engine (Sprint 1.8) - 聚合排序层 Top-N，生成每日研究日报
# 复用 ranking 的截面复合打分，并用 DataManager 补最新价/日涨跌/数据新鲜度。
report:
  top_n: 20                          # 日报展示的候选数量
  as_of: null                        # null => 每标的取最新一根 K 线
  format: markdown                   # markdown | json
  freshness_days: 5                  # 数据比 as_of 滞后超过该天数则标"滞后"
  include_detail: true               # markdown 是否展开候选明细
  include_backtest: false            # 是否给每个候选附上历史回测指标（用 backtest 段配置）

# Watchlist Tracker (Sprint 1.9) - 持久化关注池排名并派生日环比变动
# 复用 ranking 截面与 core.database 共享库；关注池内自相对排名。
watchlist:
  alert_rank_jump: 5               # |排名变化| 达到该值，日报标记"显著变动"

# Scheduler (Sprint 1.15) - 定时生成报告/自选股并推送
# notifier_type: console(打印) | file(追加到文件) | webhook(HTTP POST 到 IM)
# webhook_url 为空时 webhook 通知自动跳过，无需任何外部凭据即可运行。
scheduler:
  notifier_type: console
  webhook_url: null
  file_path: null

# Benchmark indices (Phase 2 / Sprint 2.0) - maps friendly keys to index codes.
# Consumed by DataManager.get_index_daily and ExperimentConfig.benchmark.
benchmark:
  default: csi300
  indices:
    csi300: "000300"
    csi500: "000905"
    csi1000: "000852"
    sh_composite: "000001"

# Research engine (Phase 2 / Sprint 2.0 foundation).
# metrics: null => reuse backtest.metrics (no parallel metric list).
research:
  experiment_id_prefix: "exp_"
  # metrics: null
  # AROS Strategy Score weights (Phase 3 / Sprint 3.0, E5). Sum should be 1.0.
  # Dimensions map to realised metric keys; see docs/Phase3-Technical-Design.md §4.
  scorecard:
    weights:
      total_return: 0.20
      cagr: 0.15
      win_rate: 0.20
      max_drawdown: 0.20
      profit_factor: 0.10
      sharpe: 0.10
      holding_experience: 0.05
    oos_decay_penalty: true        # E3: discount Sharpe dim if OOS decays vs IS
    oos_decay_threshold: 0.5       # decay > 50% triggers the penalty
  # Market Regime Engine (Phase 3 / Sprint 3.5, E5). Transparent 5-label
  # classifier: index momentum + realised vol + optional net limit-up breadth.
  market_regime:
    momentum_window: 20
    vol_window: 20
    drawdown_window: 20
    bull_mom: 0.05
    bear_mom: -0.05
    high_vol_cap: 0.60
    sentiment_window: 5
    emotion_hot_threshold: 0.15
    emotion_cold_threshold: -0.15

# Phase 4.0 Universe Provider mode (design §5 4.0 / §10 Q1).
# Daily screening universe is not hard-coded: type selects a provider.
#   csi800   -> CSI800Provider (akshare index constituents, seeded)
#   watchlist-> WatchlistProvider (--watchlist <file> or this path; one code per line)
#   custom   -> CustomProvider (explicit custom_codes)
universe:
  type: csi800
  watchlist_path: null
  custom_codes: null

# Phase 4.1 Research Integrity Framework (design §5 4.1 / §1.5).
# Strategy Validation Gate (宪法级闸门) + OOS Composite quality_star + Reliability.
validation:
  walk_forward: { train_years: 3, test_years: 1, step_years: 1 }
  gate:
    no_lookahead: true          # 架构保证(T+1)；代码未来函数需人工/lint
    oos_return_gt: 0.0          # OOS 收益 > 0
    oos_sharpe_gt: 0.5          # OOS Sharpe > 0.5
    max_drawdown_lt: 0.40       # 最大回撤 < 40%
    min_trades: 100             # 至少 100 次交易
    param_stable: true          # 参数敏感性测试通过(扰动后 Sharpe 衰减 < 阈值)
    param_decay_threshold: 0.5  # 平均 Sharpe 衰减超过该比例则 param_stable 失败
  quality_star:
    return_scale: 0.30          # OOS 收益 +30% -> 收益分量满分
    sharpe_scale: 2.0           # OOS Sharpe 2.0 -> Sharpe 分量满分
    drawdown_scale: 0.60        # OOS 回撤 60% -> 回撤分量 0 分
    stability_scale: 0.15       # 各 OOS 窗口收益标准差 15% -> 稳定性 0 分
    drawdown_veto: 0.40         # 回撤 > 40% -> 最高 ⭐⭐
    min_trades_veto: 100        # 交易不足 -> 最高 ⭐⭐⭐
  reliability:
    oos_weight: 0.40
    param_weight: 0.20
    period_weight: 0.20
    trades_weight: 0.20
