[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aros"
version = "0.1.0"
description = "A-Share Research Operating System - modular A-share research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare",
    "pandas",
    "numpy",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml",
    "loguru",
    "typer",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # typer uses function calls in decorator defaults

[tool.ruff.lint.per-file-ignores]
# 一次性数据注入/构建脚本,放宽格式与风格规则
"inject_*.py" = ["E501", "E401", "E701", "E702", "E731", "UP031", "UP015", "B023"]
"build_risk.py" = ["E501", "E701", "E702", "E731", "UP031", "UP015", "B023"]
"seed_demo.py" = ["E401", "I001"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["yaml.*", "dotenv.*", "akshare.*"]
ignore_missing_imports = true
